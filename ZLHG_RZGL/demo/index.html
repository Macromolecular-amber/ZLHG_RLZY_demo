<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中陆化工人力资源管理系统 · 员工信息管理</title>
<link rel="stylesheet" href="./css/app.css" />
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 16v-5a6 6 0 1 0-12 0v5l-2 2h16z"/><path d="M10 21a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h9"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></symbol>
  <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 20V6a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v14"/><path d="M15 10h4a1 1 0 0 1 1 1v9"/><path d="M8 9h3M8 13h3M8 17h3M3 20h18"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.7 5.7 0 0 1 11 0"/><path d="M16 5.5a3 3 0 0 1 0 5.6"/><path d="M17.5 14.2a5 5 0 0 1 3 4.8"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h13l-3-3"/><path d="M20 16H7l3 3"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></symbol>
  <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M3 12h18"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v2M16 3v2"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="14.5" r="1.2"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9a3.6 3.6 0 0 1 7-1.4A3.6 3.6 0 0 1 19 11c0 4.6-7 9-7 9z"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></symbol>
  <symbol id="i-award" viewBox="0 0 24 24"><circle cx="12" cy="9.5" r="5"/><path d="M9 14l-1 7 4-2 4 2-1-7"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 5a2 2 0 0 1 2-2h11v18H7a2 2 0 0 0-2 2z"/><path d="M5 19a2 2 0 0 1 2-2h11"/></symbol>
  <symbol id="i-usercheck" viewBox="0 0 24 24"><circle cx="9" cy="7.5" r="3.2"/><path d="M3.5 19a5.7 5.7 0 0 1 10-3.4"/><path d="M15 17l2 2 4-4"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.2-3 7.4-7 9-4-1.6-7-4.8-7-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-message" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-4 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v10"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V5"/><path d="M8 9l4-4 4 4"/><path d="M5 19h14"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6l-6 6-6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-id" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16a3.2 3.2 0 0 1 6 0"/><path d="M14 10h4M14 13h4"/></symbol>
</svg>

<div class="layout-container">
  <header class="top-header">
    <div class="header-left">
      <button class="menu-toggle" id="menuToggle" title="收起菜单">
        <svg class="ico"><use href="#i-menu"/></svg>
      </button>
      <div class="system-title">中陆化工人力资源管理系统</div>
    </div>
    <div class="header-right">
      <div class="global-search">
        <svg class="ico search-icon"><use href="#i-search"/></svg>
        <input class="search-input" id="globalSearch" placeholder="搜索员工 / 功能 / 单据" />
      </div>
      <div class="notify-bell" id="notifyBell" title="待办提醒">
        <svg class="ico"><use href="#i-bell"/></svg>
        <span class="notify-dot"></span>
      </div>
      <div class="user-profile">
        <div class="user-avatar">A</div>
        <div class="user-meta">
          <span class="user-name">admin</span>
          <span class="user-dept">中陆化工集团</span>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn">
        <svg class="ico"><use href="#i-logout"/></svg>退出
      </button>
    </div>
  </header>

  <div class="main-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-menu-wrapper">
        <ul class="sidebar-menu" id="sidebarMenu"></ul>
      </div>
      <div class="sidebar-footer">
        <svg class="ico" style="width:15px;height:15px"><use href="#i-folder"/></svg>
        人力资源管理 · 数字化办公
      </div>
    </aside>

    <main class="main-content">
      <div class="content-body">
        <div id="page" class="hr-page"></div>
      </div>
    </main>
  </div>
</div>

<div id="overlayRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script src="./js/data.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
